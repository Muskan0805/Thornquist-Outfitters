AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Thornquist Outfitters - second stack. Glue database, CSV classifier and crawler
  for the raw POS data, plus an Athena workgroup with its own results bucket.
  Deploy AFTER the buckets stack. Creates NO IAM roles: the crawler uses the
  existing LabRole.

Parameters:
  Suffix:
    Type: String
    Description: The SAME suffix you used in the buckets stack (it points the crawler at your raw bucket).
    AllowedPattern: "^[a-z0-9]{2,12}$"
    ConstraintDescription: Lowercase letters and digits only, 2-12 characters.

  LabRoleArn:
    Type: String
    Description: ARN of the pre-built lab role, e.g. arn:aws:iam::123456789012:role/LabRole
    AllowedPattern: "^arn:aws:iam::[0-9]{12}:role/.+$"

  GlueDatabaseName:
    Type: String
    Default: thornquist_raw
    AllowedPattern: "^[a-z0-9_]{1,64}$"
    Description: Name of the Glue database holding the raw-zone tables (lowercase, digits, underscores).

  QueryScanLimitBytes:
    Type: Number
    Default: 1073741824
    MinValue: 10485760
    Description: >
      Athena cancels any single query that would scan more than this many bytes
      (default 1 GB). Your data is tiny, so this is just a guard against a runaway
      query using up shared lab budget.

Resources:
  # --------------------------------------------------------------- GLUE CATALOG
  RawDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref GlueDatabaseName
        Description: Thornquist raw zone. Tables here describe files exactly as they arrived.

  # Tells the crawler up front that the first line is a header, instead of letting
  # it guess. Without this, a crawler can name columns col0, col1, ... when every
  # column in the file looks like text.
  PosCsvClassifier:
    Type: AWS::Glue::Classifier
    Properties:
      CsvClassifier:
        Name: !Sub "thornquist-pos-csv-${Suffix}"
        ContainsHeader: PRESENT
        Delimiter: ","
        QuoteSymbol: '"'
        AllowSingleColumn: false
        DisableValueTrimming: false

  RawPosCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Sub "thornquist-raw-pos-${Suffix}"
      Description: Crawls the raw POS CSVs and registers them as the table raw_pos, partitioned by dt.
      Role: !Ref LabRoleArn
      DatabaseName: !Ref RawDatabase
      TablePrefix: "raw_"
      Classifiers:
        - !Ref PosCsvClassifier
      Targets:
        S3Targets:
          # Only pos/. The quarantine/ folder sits beside it in the raw bucket and is
          # deliberately NOT crawled, so rejected files never become table data.
          - Path: !Sub "s3://thornquist-raw-${Suffix}/pos/"
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG
      # CombineCompatibleSchemas: one table for all the daily folders.
      # InheritFromTable: every dt= partition uses the table's column types. The
      # POS files are messy, so one day's price column can look numeric and the
      # next day's text ("N/A"); without this, Athena can fail on that mismatch.
      Configuration: |
        {
          "Version": 1.0,
          "Grouping": { "TableGroupingPolicy": "CombineCompatibleSchemas" },
          "CrawlerOutput": { "Partitions": { "AddOrUpdateBehavior": "InheritFromTable" } }
        }
      Tags:
        Project: thornquist

  # --------------------------------------------------------------------- ATHENA
  AthenaResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "thornquist-athena-results-${Suffix}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireQueryResults
            Status: Enabled
            ExpirationInDays: 7
      Tags:
        - { Key: Project, Value: thornquist }
        - { Key: Purpose, Value: athena-query-results }

  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub "thornquist-${Suffix}"
      Description: Thornquist project queries. Results are written to the results bucket.
      State: ENABLED
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        BytesScannedCutoffPerQuery: !Ref QueryScanLimitBytes
        EngineVersion:
          SelectedEngineVersion: "Athena engine version 3"
        ResultConfiguration:
          OutputLocation: !Sub "s3://${AthenaResultsBucket}/results/"
      Tags:
        - { Key: Project, Value: thornquist }

Outputs:
  GlueDatabaseName:
    Value: !Ref RawDatabase
  CrawlerName:
    Description: Start this crawler to create or refresh the raw_pos table.
    Value: !Ref RawPosCrawler
  AthenaWorkGroupName:
    Description: Pick this workgroup in the Athena query editor.
    Value: !Ref AthenaWorkGroup
  AthenaResultsBucketName:
    Value: !Ref AthenaResultsBucket
