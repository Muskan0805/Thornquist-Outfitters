AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Thornquist Outfitters - second stack. Glue database, CSV classifier and crawler
  for the raw POS data, hand-written tables for the raw e-commerce JSON and customer extract, plus an Athena workgroup with its own results bucket.
  Deploy AFTER the buckets stack. Creates NO IAM roles: the crawler uses the
  existing LabRole.

Parameters:
  Suffix:
    Type: String
    Description: The SAME suffix you used in the buckets stack (it points the crawler at your raw bucket).
    AllowedPattern: "^[a-z0-9]{2,12}$"
    ConstraintDescription: Lowercase letters and digits only, 2-12 characters.

  LabRoleArn:
    Type: String
    Description: ARN of the pre-built lab role, e.g. arn:aws:iam::123456789012:role/LabRole
    AllowedPattern: "^arn:aws:iam::[0-9]{12}:role/.+$"

  GlueDatabaseName:
    Type: String
    Default: thornquist_raw
    AllowedPattern: "^[a-z0-9_]{1,64}$"
    Description: Name of the Glue database holding the raw-zone tables (lowercase, digits, underscores).

  QueryScanLimitBytes:
    Type: Number
    Default: 1073741824
    MinValue: 10485760
    Description: >
      Athena cancels any single query that would scan more than this many bytes
      (default 1 GB). Your data is tiny, so this is just a guard against a runaway
      query using up shared lab budget.

Resources:
  # --------------------------------------------------------------- GLUE CATALOG
  RawDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref GlueDatabaseName
        Description: Thornquist raw zone. Tables here describe files exactly as they arrived.

  # Tells the crawler up front that the first line is a header, instead of letting
  # it guess. Without this, a crawler can name columns col0, col1, ... when every
  # column in the file looks like text.
  PosCsvClassifier:
    Type: AWS::Glue::Classifier
    Properties:
      CsvClassifier:
        Name: !Sub "thornquist-pos-csv-${Suffix}"
        ContainsHeader: PRESENT
        Delimiter: ","
        QuoteSymbol: '"'
        AllowSingleColumn: false
        DisableValueTrimming: false

  RawPosCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Sub "thornquist-raw-pos-${Suffix}"
      Description: Crawls the raw POS CSVs and registers them as the table raw_pos, partitioned by dt.
      Role: !Ref LabRoleArn
      DatabaseName: !Ref RawDatabase
      TablePrefix: "raw_"
      Classifiers:
        - !Ref PosCsvClassifier
      Targets:
        S3Targets:
          # Only pos/. The quarantine/ folder sits beside it in the raw bucket and is
          # deliberately NOT crawled, so rejected files never become table data.
          - Path: !Sub "s3://thornquist-raw-${Suffix}/pos/"
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG
      # CombineCompatibleSchemas: one table for all the daily folders.
      # InheritFromTable: every dt= partition uses the table's column types. The
      # POS files are messy, so one day's price column can look numeric and the
      # next day's text ("N/A"); without this, Athena can fail on that mismatch.
      Configuration: |
        {
          "Version": 1.0,
          "Grouping": { "TableGroupingPolicy": "CombineCompatibleSchemas" },
          "CrawlerOutput": { "Partitions": { "AddOrUpdateBehavior": "InheritFromTable" } }
        }
      Tags:
        Project: thornquist

  # E-commerce orders are nested JSON (a customer object, an address object and an
  # array of items), so this table is written by hand instead of crawled. A crawler
  # would have to guess those shapes. The partition projection settings below make
  # Athena find the dt= folders by itself, so no crawler run is needed after an upload.
  RawEcommerceTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref RawDatabase
      TableInput:
        Name: raw_ecommerce
        Description: E-commerce orders exactly as they arrived (JSON lines, one order per line).
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: json
          EXTERNAL: "TRUE"
          projection.enabled: "true"
          projection.dt.type: date
          projection.dt.format: yyyy-MM-dd
          projection.dt.range: "2026-01-01,NOW"
          projection.dt.interval: "1"
          projection.dt.interval.unit: DAYS
          storage.location.template: !Sub "s3://thornquist-raw-${Suffix}/ecommerce/dt=${!dt}/"
        PartitionKeys:
          - { Name: dt, Type: string }
        StorageDescriptor:
          Location: !Sub "s3://thornquist-raw-${Suffix}/ecommerce/"
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters:
              case.insensitive: "true"
          Columns:
            - { Name: orderid, Type: string }
            - { Name: ordertimestamp, Type: string }
            - { Name: channel, Type: string }
            - { Name: currency, Type: string }
            - { Name: customer, Type: "struct<customerid:bigint,guest:boolean>" }
            - { Name: shippingaddress, Type: "struct<province:string,country:string>" }
            - Name: items
              Type: "array<struct<sku:string,title:string,categorypath:string,qty:int,pricecents:bigint>>"

  # The customer extract is pipe-delimited text with a header line. Like the e-commerce
  # table it is written by hand (all columns text, nothing guessed) and uses partition
  # projection, so a new weekly snapshot is queryable as soon as it reaches raw.
  RawCustomersTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref RawDatabase
      TableInput:
        Name: raw_customers
        Description: Customer extract snapshots exactly as they arrived (pipe-delimited, one snapshot per dt folder).
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: csv
          EXTERNAL: "TRUE"
          skip.header.line.count: "1"
          projection.enabled: "true"
          projection.dt.type: date
          projection.dt.format: yyyy-MM-dd
          projection.dt.range: "2026-01-01,NOW"
          projection.dt.interval: "1"
          projection.dt.interval.unit: DAYS
          storage.location.template: !Sub "s3://thornquist-raw-${Suffix}/customers/dt=${!dt}/"
        PartitionKeys:
          - { Name: dt, Type: string }
        StorageDescriptor:
          Location: !Sub "s3://thornquist-raw-${Suffix}/customers/"
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.serde2.OpenCSVSerde
            Parameters:
              separatorChar: "|"
              quoteChar: '"'
          Columns:
            - { Name: cust_no, Type: string }
            - { Name: first_name, Type: string }
            - { Name: last_name, Type: string }
            - { Name: email, Type: string }
            - { Name: signup_dt, Type: string }
            - { Name: province, Type: string }
            - { Name: segment_cd, Type: string }
            - { Name: opt_in, Type: string }

  # --------------------------------------------------------------------- ATHENA
  AthenaResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "thornquist-athena-results-${Suffix}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireQueryResults
            Status: Enabled
            ExpirationInDays: 7
      Tags:
        - { Key: Project, Value: thornquist }
        - { Key: Purpose, Value: athena-query-results }

  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub "thornquist-${Suffix}"
      Description: Thornquist project queries. Results are written to the results bucket.
      State: ENABLED
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        BytesScannedCutoffPerQuery: !Ref QueryScanLimitBytes
        EngineVersion:
          SelectedEngineVersion: "Athena engine version 3"
        ResultConfiguration:
          OutputLocation: !Sub "s3://${AthenaResultsBucket}/results/"
      Tags:
        - { Key: Project, Value: thornquist }

Outputs:
  GlueDatabaseName:
    Value: !Ref RawDatabase
  CrawlerName:
    Description: Start this crawler to create or refresh the raw_pos table.
    Value: !Ref RawPosCrawler
  EcommerceTableName:
    Description: Hand-written table for the nested e-commerce JSON. Query it directly in Athena.
    Value: !Ref RawEcommerceTable
  CustomersTableName:
    Description: Hand-written table for the raw customer extract. Query it directly in Athena.
    Value: !Ref RawCustomersTable
  AthenaWorkGroupName:
    Description: Pick this workgroup in the Athena query editor.
    Value: !Ref AthenaWorkGroup
  AthenaResultsBucketName:
    Value: !Ref AthenaResultsBucket
