AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Thornquist Outfitters - third stack. The raw-to-trusted Glue ETL jobs (sales from POS and
  e-commerce, and the customer extract), a weekly schedule for the customer job, a bucket for
  the job scripts, and a Glue database plus crawler for the trusted zone.
  Deploy AFTER the buckets stack. Creates NO IAM roles: the job and crawler use LabRole.

Parameters:
  Suffix:
    Type: String
    Description: The SAME suffix you used in the buckets stack.
    AllowedPattern: "^[a-z0-9]{2,12}$"
    ConstraintDescription: Lowercase letters and digits only, 2-12 characters.

  LabRoleArn:
    Type: String
    Description: ARN of the pre-built lab role, e.g. arn:aws:iam::123456789012:role/LabRole
    AllowedPattern: "^arn:aws:iam::[0-9]{12}:role/.+$"

  TrustedDatabaseName:
    Type: String
    Default: thornquist_trusted
    AllowedPattern: "^[a-z0-9_]{1,64}$"
    Description: Name of the Glue database holding the trusted-zone tables.

  GlueVersion:
    Type: String
    Default: "5.0"
    AllowedValues: ["4.0", "5.0"]
    Description: Glue runtime. 5.0 uses Spark 3.5. Switch to 4.0 only if 5.0 is unavailable in your lab.

  NumberOfWorkers:
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 5
    Description: >
      Spark workers (G.1X, 1 DPU each). 2 is the minimum and plenty for this data.
      Glue bills by the second, so a short run costs only a few cents of lab budget.

  JobTimeoutMinutes:
    Type: Number
    Default: 15
    MinValue: 5
    MaxValue: 120
    Description: The job is stopped after this long, so a stuck run cannot keep spending budget.

  SalesScriptKey:
    Type: String
    Default: glue/raw_to_trusted_sales.py
    Description: Where the sales job script is stored in the scripts bucket. You upload it there after this stack is created.

  CustomersScriptKey:
    Type: String
    Default: glue/raw_to_trusted_customers.py
    Description: Where the customer job script is stored in the scripts bucket.

  UsdToCad:
    Type: String
    Default: "1.35"
    AllowedPattern: "^[0-9]{1,2}(\\.[0-9]{1,4})?$"
    ConstraintDescription: A number such as 1.35
    Description: >
      Exchange rate used to convert USD e-commerce orders to CAD. A fixed, documented rate
      keeps the data reproducible. Change it here and re-run the sales job to apply a new one.

  CustomerSchedule:
    Type: String
    Default: "cron(0 6 ? * MON *)"
    Description: >
      When the customer job runs (AWS cron, UTC). Default: Mondays at 06:00 UTC, because the
      customer extract arrives weekly.

  CustomerScheduleEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set to false to create the schedule switched off (for example while the lab is idle).

Resources:
  # ---------------------------------------------------------------- SCRIPT STORE
  ScriptsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "thornquist-scripts-${Suffix}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - { Key: Project, Value: thornquist }
        - { Key: Purpose, Value: glue-scripts }

  # ----------------------------------------------------------------- GLUE JOB
  RawToTrustedSalesJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub "thornquist-raw-to-trusted-sales-${Suffix}"
      Description: >
        Reads the raw POS CSVs and e-commerce JSON orders, conforms them to the shared sales
        schema (dates, customer ID, SKU, category, price in CAD, one row per item) and writes
        partitioned Parquet to the trusted bucket. It does not drop or fix bad records;
        unparseable values become NULL and are listed in the parse_errors column for the
        data quality gate.
      Role: !Ref LabRoleArn
      GlueVersion: !Ref GlueVersion
      WorkerType: G.1X
      NumberOfWorkers: !Ref NumberOfWorkers
      Timeout: !Ref JobTimeoutMinutes
      MaxRetries: 0
      ExecutionProperty:
        MaxConcurrentRuns: 1
      Command:
        Name: glueetl
        PythonVersion: "3"
        ScriptLocation: !Sub "s3://${ScriptsBucket}/${SalesScriptKey}"
      DefaultArguments:
        "--job-language": python
        "--RAW_BUCKET": !Sub "thornquist-raw-${Suffix}"
        "--TRUSTED_BUCKET": !Sub "thornquist-trusted-${Suffix}"
        "--USD_TO_CAD": !Ref UsdToCad
        "--enable-metrics": "true"
        "--enable-continuous-cloudwatch-log": "true"
        "--job-bookmark-option": job-bookmark-disable
      Tags:
        Project: thornquist

  RawToTrustedCustomersJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub "thornquist-raw-to-trusted-customers-${Suffix}"
      Description: >
        Reads the latest raw customer snapshot (pipe-delimited), converts dates, province
        names and the opt-in flag, and writes Parquet to the trusted bucket. Runs weekly
        on a schedule. Duplicates and placeholder values are left for the quality gate.
      Role: !Ref LabRoleArn
      GlueVersion: !Ref GlueVersion
      WorkerType: G.1X
      NumberOfWorkers: !Ref NumberOfWorkers
      Timeout: !Ref JobTimeoutMinutes
      MaxRetries: 0
      ExecutionProperty:
        MaxConcurrentRuns: 1
      Command:
        Name: glueetl
        PythonVersion: "3"
        ScriptLocation: !Sub "s3://${ScriptsBucket}/${CustomersScriptKey}"
      DefaultArguments:
        "--job-language": python
        "--RAW_BUCKET": !Sub "thornquist-raw-${Suffix}"
        "--TRUSTED_BUCKET": !Sub "thornquist-trusted-${Suffix}"
        "--enable-metrics": "true"
        "--enable-continuous-cloudwatch-log": "true"
        "--job-bookmark-option": job-bookmark-disable
      Tags:
        Project: thornquist

  # Ingestion mechanism 3: a scheduled batch pull. The customer list is a weekly dump,
  # so a timer (not a file arrival) starts the job, which then picks up the newest snapshot.
  CustomersSchedule:
    Type: AWS::Glue::Trigger
    Properties:
      Name: !Sub "thornquist-customers-weekly-${Suffix}"
      Description: Runs the customer job once a week.
      Type: SCHEDULED
      Schedule: !Ref CustomerSchedule
      StartOnCreation: !Ref CustomerScheduleEnabled
      Actions:
        - JobName: !Ref RawToTrustedCustomersJob
      Tags:
        Project: thornquist

  # ------------------------------------------------------------- TRUSTED CATALOG
  TrustedDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref TrustedDatabaseName
        Description: Thornquist trusted zone. Conformed, typed tables.

  # Crawls sales_conformed/ and customers_conformed/. When the data quality gate starts
  # writing its passed records to sales/ (and rejected ones to a quarantine folder), add
  # those folders as extra targets here.
  TrustedCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Sub "thornquist-trusted-${Suffix}"
      Description: Registers the conformed Parquet as the tables sales_conformed (partitioned by dt) and customers_conformed.
      Role: !Ref LabRoleArn
      DatabaseName: !Ref TrustedDatabase
      Targets:
        S3Targets:
          - Path: !Sub "s3://thornquist-trusted-${Suffix}/sales_conformed/"
          - Path: !Sub "s3://thornquist-trusted-${Suffix}/customers_conformed/"
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG
      Configuration: |
        {
          "Version": 1.0,
          "Grouping": { "TableGroupingPolicy": "CombineCompatibleSchemas" },
          "CrawlerOutput": { "Partitions": { "AddOrUpdateBehavior": "InheritFromTable" } }
        }
      Tags:
        Project: thornquist

Outputs:
  ScriptsBucketName:
    Value: !Ref ScriptsBucket
  UploadScriptsCommand:
    Description: Run this from the repo folder to put both job scripts in place before starting the jobs.
    Value: !Sub "aws s3 cp glue/raw_to_trusted_sales.py s3://${ScriptsBucket}/${SalesScriptKey} && aws s3 cp glue/raw_to_trusted_customers.py s3://${ScriptsBucket}/${CustomersScriptKey}"
  SalesJobName:
    Value: !Ref RawToTrustedSalesJob
  CustomersJobName:
    Value: !Ref RawToTrustedCustomersJob
  CustomersScheduleName:
    Value: !Ref CustomersSchedule
  TrustedDatabaseName:
    Value: !Ref TrustedDatabase
  TrustedCrawlerName:
    Value: !Ref TrustedCrawler
